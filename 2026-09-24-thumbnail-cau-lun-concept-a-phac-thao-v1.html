<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b232c"/><stop offset=".6" stop-color="#3a4550"/><stop offset="1" stop-color="#55606a"/></linearGradient>
 <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5236"/><stop offset="1" stop-color="#3a2b1c"/></linearGradient>
 <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8eef2" stop-opacity=".55"/><stop offset="1" stop-color="#e8eef2" stop-opacity="0"/></linearGradient>
 <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9bec2"/><stop offset="1" stop-color="#5d6368"/></linearGradient>
 <linearGradient id="pier" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9398"/><stop offset="1" stop-color="#4c5156"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<!-- storm clouds -->
<g fill="#10161c" opacity=".7" filter="url(#blur)"><ellipse cx="200" cy="80" rx="320" ry="70"/><ellipse cx="700" cy="50" rx="380" ry="60"/><ellipse cx="1150" cy="110" rx="300" ry="80"/></g>
<!-- far bank -->
<path d="M0 330 L220 300 L420 318 L640 296 L900 312 L1280 290 L1280 360 L0 360Z" fill="#232a26"/>
<!-- river -->
<rect y="355" width="1280" height="365" fill="url(#river)"/>
<g stroke="#8a6d4b" stroke-width="3" opacity=".5" fill="none"><path d="M0 430 Q300 420 640 440 T1280 430"/><path d="M0 520 Q320 505 700 530 T1280 515"/><path d="M0 620 Q360 600 760 630 T1280 610"/></g>
<!-- light shaft onto kink -->
<polygon points="780,0 930,0 1000,520 760,520" fill="url(#shaft)"/>
<!-- normal piers -->
<g fill="url(#pier)"><rect x="120" y="300" width="46" height="170"/><rect x="420" y="300" width="46" height="175"/><rect x="1180" y="300" width="46" height="180"/></g>
<!-- sinking tilted pier -->
<g transform="rotate(9 880 520)"><rect x="855" y="365" width="54" height="190" fill="url(#pier)"/></g>
<!-- mud rings -->
<g fill="none" stroke="#a78a63" opacity=".75"><ellipse cx="895" cy="540" rx="70" ry="16" stroke-width="4"/><ellipse cx="895" cy="545" rx="115" ry="26" stroke-width="3"/><ellipse cx="895" cy="552" rx="165" ry="36" stroke-width="2"/></g>
<g fill="#cbb58f" opacity=".8"><circle cx="840" cy="540" r="4"/><circle cx="950" cy="548" r="5"/><circle cx="905" cy="560" r="3"/><circle cx="870" cy="555" r="3"/></g>
<!-- deck with V kink at x~880 -->
<path d="M-20 262 L700 272 L880 360 L1060 276 L1300 268 L1300 300 L1060 308 L880 392 L700 304 L-20 294Z" fill="url(#deck)"/>
<path d="M-20 262 L700 272 L880 360 L1060 276 L1300 268" stroke="#dfe3e5" stroke-width="3" fill="none"/>
<!-- railings -->
<path d="M-20 250 L700 260 L880 348 L1060 264 L1300 256" stroke="#9aa0a4" stroke-width="3" fill="none"/>
<!-- cracks -->
<g stroke="#1a1d20" stroke-width="3" fill="none"><path d="M800 318 L815 332 L808 345 L822 360"/><path d="M880 362 L870 378 L884 390"/><path d="M955 322 L945 336 L958 350"/><path d="M860 350 L840 352 L830 366"/></g>
<!-- barge + yellow rig -->
<rect x="560" y="470" width="150" height="26" fill="#2d2f31"/>
<rect x="600" y="440" width="46" height="32" fill="#e8b21c"/>
<polygon points="628,440 640,440 622,330 614,330" fill="#e8b21c"/>
<line x1="618" y1="330" x2="618" y2="470" stroke="#caa01a" stroke-width="3"/>
<!-- vignette -->
<rect width="1280" height="720" fill="url(#vig)"/>
<!-- title overlay upper left -->
<g font-family="FreeSans, Liberation Sans, sans-serif" font-weight="bold" font-size="112" stroke="#000" stroke-width="12" paint-order="stroke" letter-spacing="2">
 <text x="48" y="140" fill="#ffffff">IT WON'T</text>
 <text x="48" y="250" fill="#f2b90f">STOP</text>
</g>
</svg></body></html>
